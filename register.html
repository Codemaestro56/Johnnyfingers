    .auth-wrapper {
      min-height: 85vh;

    .auth-card {
      width: 100%;

      background: var(--card-bg);

      backdrop-filter: blur(12px);

    }

    .eyebrow-pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: rgba(249, 115, 22, 0.15);
      border: 1px solid rgba(249, 115, 22, 0.3);
      color: var(--primary-orange);

    .alert-banner.error {
      background: rgba(239, 68, 68, 0.15);

    .form-group { margin-bottom: 18px; }

    .form-group label {

    }

    .form-control:focus { outline: none; border-color: var(--primary-orange); }

    .btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 12px 24px;
      border-radius: 8px;
      font-weight: 600;
      font-size: 15px;
      cursor: pointer;

      justify-content: center;
    }

    .btn-primary { background: var(--primary-orange); color: #fff; }
    .btn-primary:hover { background: var(--primary-hover); }

    .auth-footer {
      text-align: center;
      margin-top: 24px;
      font-size: 14px;
      color: var(--text-muted);
    }

    .auth-footer a { color: var(--primary-orange); text-decoration: none; font-weight: 600; }

<body>

<header class="site-header">
  <div class="container nav-row">
     <a href="Home.php" class="brand-logo" style="display: inline-flex; align-items: center; text-decoration: none;">
  <img src="images/logo.png" alt="Johnny Fingers Logo" style="height: 45px; width: auto; object-fit: contain;">
</a>
    
    <a href="Home.php" style="color: var(--text-muted); font-size: 14px; text-decoration: none;"><i class="fa-solid fa-arrow-left"></i> Home</a>
  </div>
</header>

<div class="auth-wrapper">
  <div class="auth-card">
    
    <div class="alert-banner error" id="errorBanner">
      <i class="fa-solid fa-circle-exclamation"></i> <span id="errorMessage">An error occurred during registration.</span>
    </div>

    <div style="text-align: center; margin-bottom: 28px;">
      <a href="Home.php" style="display: inline-flex; align-items: center; gap: 8px; text-decoration: none;">
        <img src="images/logo.png" alt="Johnny Fingers Logo" style="height: 40px; width: auto;" onerror="this.style.display='none'">
      </a>
      <h2 class="display" style="font-size: 1.8rem; margin-top: 8px;">Create Account</h2>
    </div>

    <form action="register.php" method="POST" onsubmit="return validatePasswords()">
      <div class="form-group">
        <label for="fullName">Full Name</label>
        <input type="text" id="fullName" name="full_name" class="form-control" placeholder="John Doe" required>
      </div>

      <div class="form-group">
        <label for="email">Email Address</label>
        <input type="email" id="email" name="email" class="form-control" placeholder="john@example.com" required>
      </div>

      <div class="form-group">
        <label for="phone">Phone Number</label>
        <input type="tel" id="phone" name="phone" class="form-control" placeholder="+234 800 000 0000" required>
      </div>

      <div class="form-group">
        <label for="password">Password</label>
        <input type="password" id="password" name="password" class="form-control" placeholder="••••••••" required minlength="6">
      </div>

      <div class="form-group">
        <label for="confirmPassword">Confirm Password</label>
        <input type="password" id="confirmPassword" class="form-control" placeholder="••••••••" required minlength="6">
      </div>

      <button type="submit" class="btn btn-primary" style="margin-top: 10px;">
        <i class="fa-solid fa-user-check"></i> Register Account
      </button>
    </form>

    <div class="auth-footer">
      Already have an account? <a href="login.html">Log in here</a>
    </div>

  </div>
</div>

<script>
  // Check for error parameters in URL
  const urlParams = new URLSearchParams(window.location.search);
  const error = urlParams.get('error');

  if (error) {
    const errorBanner = document.getElementById('errorBanner');
    const errorMessage = document.getElementById('errorMessage');
    
    if (error === 'exists') {
      errorMessage.innerText = 'An account with this email address already exists.';
    } else if (error === 'failed') {
      errorMessage.innerText = 'Registration failed. Please try again.';
    } else if (error === 'mismatch') {
      errorMessage.innerText = 'Passwords did not match.';
    }
    
    errorBanner.style.display = 'block';
  }

  // Client-side password validation check
  function validatePasswords() {
    const password = document.getElementById('password').value;
    const confirmPassword = document.getElementById('confirmPassword').value;

    if (password !== confirmPassword) {
      const errorBanner = document.getElementById('errorBanner');
      const errorMessage = document.getElementById('errorMessage');
      errorMessage.innerText = 'Passwords do not match. Please check and try again.';
      errorBanner.style.display = 'block';
      return false;
    }
    return true;
  }
</script>

</body>
</html>
