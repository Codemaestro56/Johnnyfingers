<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Student Login — Johnnyfingers Academy</title>
  
  <!-- External Fonts & Icons -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Work+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <!-- Bootstrap + Theme -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="assets/theme.css">
  <!-- Internal Page Styles -->
  <style>
    :root {
      --bg-dark: #0f172a;
      --card-bg: rgba(30, 41, 59, 0.9);
      --card-border: rgba(255, 255, 255, 0.1);
      --input-bg: #0f172a;
      --primary-orange: #2563eb;
      --primary-hover: #1d4ed8;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --text-subtle: #cbd5e1;
      --font-display: 'Oswald', sans-serif;
      --font-body: 'Work Sans', sans-serif;
      --font-mono: 'IBM Plex Mono', monospace;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background-color: var(--bg-dark);
      color: var(--text-main);
      font-family: var(--font-body);
      line-height: 1.6;
      min-height: 100vh;
    }

    .display { font-family: var(--font-display); text-transform: uppercase; letter-spacing: 0.5px; }
    .mono { font-family: var(--font-mono); }

    .site-header {
      background: rgba(15, 23, 42, 0.9);
      border-bottom: 1px solid var(--card-border);
      backdrop-filter: blur(12px);
      padding: 16px 0;
    }

    .container { width: 100%; max-width: 1200px; margin: 0 auto; padding: 0 20px; }

    .nav-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 10px;
      text-decoration: none;
      color: var(--text-main);
    }

    .logo .mark {
      background: var(--primary-orange);
      color: #fff;
      width: 36px;
      height: 36px;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .auth-wrapper {
      min-height: 85vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 40px 15px;
    }

    .auth-card {
      width: 100%;
      max-width: 420px;
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 16px;
      padding: 36px;
      backdrop-filter: blur(12px);
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5);
    }

    .eyebrow-pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: rgba(37, 99, 235, 0.15);
      border: 1px solid rgba(37, 99, 235, 0.3);
      color: var(--primary-orange);
      padding: 4px 12px;
      border-radius: 20px;
      font-size: 11px;
      font-weight: 600;
    }

    /* Banners */
    .alert-banner {
      display: none;
      padding: 12px 16px;
      border-radius: 8px;
      font-size: 13px;
      margin-bottom: 20px;
      font-weight: 500;
    }

    .alert-banner.success {
      background: rgba(34, 197, 94, 0.15);
      border: 1px solid rgba(34, 197, 94, 0.3);
      color: #4ade80;
    }

    .alert-banner.error {
      background: rgba(239, 68, 68, 0.15);
      border: 1px solid rgba(239, 68, 68, 0.3);
      color: #f87171;
    }

    .form-group { margin-bottom: 20px; position: relative; }

    .form-group label {
      display: block;
      font-size: 14px;
      color: var(--text-subtle);
      margin-bottom: 8px;
    }

    .input-wrapper {
      position: relative;
    }

    .form-control {
      width: 100%;
      padding: 12px 16px;
      background: var(--input-bg);
      border: 1px solid var(--card-border);
      border-radius: 8px;
      color: var(--text-main);
      font-size: 15px;
    }

    .form-control:focus { outline: none; border-color: var(--primary-orange); }

    .toggle-pw {
      position: absolute;
      right: 14px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--text-muted);
      cursor: pointer;
      background: none;
      border: none;
      font-size: 14px;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 12px 24px;
      border-radius: 8px;
      font-weight: 600;
      font-size: 15px;
      cursor: pointer;
      border: none;
      text-decoration: none;
      width: 100%;
      justify-content: center;
      transition: background 0.2s ease;
    }

    .btn-primary { background: var(--primary-orange); color: #fff; }
    .btn-primary:hover { background: var(--primary-hover); }

    .auth-footer {
      text-align: center;
      margin-top: 24px;
      font-size: 14px;
      color: var(--text-muted);
    }

    .auth-footer a { color: var(--primary-orange); text-decoration: none; font-weight: 600; }
    .auth-footer a:hover { text-decoration: underline; }
  </style>
</head>
<body>

<header class="site-header">
  <div class="container nav-row">
 <a href="Home.html" class="brand-logo" style="display: inline-flex; align-items: center; text-decoration: none;">
  <img src="images/logo.png" alt="Johnny Fingers Logo" style="height: 45px; width: auto; object-fit: contain;">
</a>
    
    <a href="Home.html" style="color: var(--text-muted); font-size: 14px; text-decoration: none;"><i class="fa-solid fa-arrow-left"></i> Home</a>
  </div>
</header>

<div class="auth-wrapper">
  <div class="auth-card">
    <div style="text-align: center; margin-bottom: 28px;">
      <span class="eyebrow-pill mono"><i class="fa-solid fa-lock"></i> Student Access</span>
      <h2 class="display" style="font-size: 1.8rem; margin-top: 8px;">Welcome Back</h2>
    </div>

    <!-- Alert Containers -->
    <div id="registeredBanner" class="alert-banner success">
      <i class="fa-solid fa-circle-check"></i> Registration successful! Please log in with your credentials.
    </div>

    <div id="errorBanner" class="alert-banner error"></div>

    <form action="login.php" method="POST">
      <div class="form-group">
        <label for="email">Email Address</label>
        <input type="email" id="email" name="email" class="form-control" placeholder="john@example.com" required autocomplete="email">
      </div>

      <div class="form-group">
        <label for="password">Password</label>
        <div class="input-wrapper">
          <input type="password" id="password" name="password" class="form-control" placeholder="••••••••" required autocomplete="current-password">
          <button type="button" class="toggle-pw" onclick="togglePasswordVisibility()">
            <i id="toggleIcon" class="fa-solid fa-eye"></i>
          </button>
        </div>
      </div>

      <button type="submit" class="btn btn-primary" style="margin-top: 10px;">
        <i class="fa-solid fa-right-to-bracket"></i> Log In to Portal
      </button>
    </form>

    <div class="auth-footer">
      Don't have an account yet? <a href="register.html">Register here</a>
    </div>

  </div>
</div>

<script>
  // Parse query params for response messages
  const urlParams = new URLSearchParams(window.location.search);
  
  if (urlParams.get('registered') === 'success') {
    document.getElementById('registeredBanner').style.display = 'block';
  }

  const errorType = urlParams.get('error');
  const errorBanner = document.getElementById('errorBanner');

  if (errorType) {
    let errorMsg = 'An error occurred during authentication.';
    if (errorType === 'invalid') errorMsg = 'Invalid email address or password.';
    if (errorType === 'empty') errorMsg = 'Please enter both your email and password.';
    if (errorType === 'system') errorMsg = 'A system error occurred. Please try again later.';
    
    errorBanner.innerHTML = `<i class="fa-solid fa-circle-exclamation"></i> ${errorMsg}`;
    errorBanner.style.display = 'block';
  }

  // Password Visibility Switcher
  function togglePasswordVisibility() {
    const pwInput = document.getElementById('password');
    const icon = document.getElementById('toggleIcon');
    if (pwInput.type === 'password') {
      pwInput.type = 'text';
      icon.classList.remove('fa-eye');
      icon.classList.add('fa-eye-slash');
    } else {
      pwInput.type = 'password';
      icon.classList.remove('fa-eye-slash');
      icon.classList.add('fa-eye');
    }
  }
</script>

</body>
</html>
